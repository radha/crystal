[package]
name = "bench_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
deadpool-postgres = "0.14"
chrono = "0.4"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
